rules:
  ### Rotational Controls
  - type: axis
    name: pitch
    input:
      device: right-stick
      axis: Y
    output:
      device: primary
      axis: Y

  - type: axis
    name: roll (turret yaw)
    input:
      device: right-stick
      axis: X
    output:
      device: primary
      axis: X

  - type: axis
    name: yaw
    input:
      device: pedals
      axis: Z
    output:
      device: primary
      axis: Z

  ### Translation Controls
  - type: axis
    name: throttle
    input:
      device: left-stick
      axis: Y
    output:
      device: primary
      axis: RY

  - type: axis
    name: translation lateral
    input:
      device: left-stick
      axis: X
    output:
      device: primary
      axis: RX

  ### Freelook controls
  - type: axis
    name: Freelook X
    input:
      device: right-stick
      axis: RX
    output:
      device: secondary
      axis: X
  - type: axis
    name: Freelook Y
    input:
      device: right-stick
      axis: RY
    output:
      device: secondary
      axis: Y

      
  # Vertical thrust is on the VPC "paddles" in the main flight mode
  - type: axis-combined
    name: translation vertical
    modes:
      - main
    input_lower:
      device: left-stick
      axis: Throttle
      inverted: true
    input_upper:
      device: right-stick
      axis: Throttle
    output:
      device: primary
      axis: RZ

  # By default, the left thumbstick controls tractor beam via mousewheel
  - type: axis-to-relaxis
    name: tractor in
    modes:
      - main
    repeat_rate_max: 50
    repeat_rate_min: 500
    increment: -1
    input:
      device: left-stick
      axis: RY
      deadzone_start: 0
      deadzone_end: 30500
    output:
      device: mouse
      axis: REL_WHEEL

  - type: axis-to-relaxis
    name: tractor out
    modes:
      - main
    repeat_rate_max: 50
    repeat_rate_min: 500
    increment: 1
    input:
      device: left-stick
      axis: RY
      deadzone_start: 29500
      deadzone_end: 64000
      inverted: true
    output:
      device: mouse
      axis: REL_WHEEL

  # In Mining mode, we move vertical thrust to the left thumbstick
  # and remap the right paddle to be mining laser power
  - type: axis
    name: translation up/down alternate
    modes:
      - mining
    input:
      device: left-stick
      axis: RY
    output:
      device: primary
      axis: RZ

  - type: axis
    name: mining laser
    modes:
      - mining
    input:
      device: right-stick
      axis: Throttle
    output:
      device: primary
      axis: Throttle
