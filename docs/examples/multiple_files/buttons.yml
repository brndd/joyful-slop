rules:
  # Special Rules
  - name: Right Trigger
    type: button-combo
    inputs:
      - device: right-stick
        button: BTN_THUMB
      - device: right-stick
        button: BTN_THUMB2
    output:
      device: primary
      button: 0

  - name: Left Trigger
    type: button-combo
    inputs:
      - device: left-stick
        button: BTN_THUMB
      - device: left-stick
        button: BTN_THUMB2
    output:
      device: primary
      button: 1

  - name: ButtonBoxModeShift
    type: mode-select
    input:
      device: button-box
      button: BTN_BASE2
    output:
      modes:
        - main
        - mining

